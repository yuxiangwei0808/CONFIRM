external_evidence_sets:
  - evidence_set_id: ad_aging_nacc_smri
    target_family: ad_aging
    modality: sMRI
    feature_family: regional_volume
    discovery_partition_id: NACC_EXTERNAL_DISC
    replication_partition_ids: [NACC_EXTERNAL_REP]
    supported_predictors: [confirm_dx, dx, age]
    supported_group_vars: [confirm_dx, dx]
    priority: 10
    confirmation_role: primary
    units: {"eTIV": "mm3", "smri_*": "mm3"}

  - evidence_set_id: psychosis_cnp_smri
