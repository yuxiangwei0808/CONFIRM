name: Project website

on:
  push:
    branches: [demo/visual-guide]
    paths: ["demo/**", ".github/workflows/visual-guide.yml"]
  pull_request:
    paths: ["demo/**", ".github/workflows/visual-guide.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-guide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate evidence and links
        run: python demo/validate.py
      - name: Check browser code
        run: |
          node --check demo/site/project.js
          node --check demo/site/guide/app.js
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: demo/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/demo/visual-guide'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the project website
        id: deployment
        uses: actions/deploy-pages@v4
