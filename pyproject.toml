[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confirm"
version = "0.1.1"
description = "An agentic framework for scientific reporting in neuroimaging."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Yuxiang Wei"},
  {name = "Lijing Zhu"},
  {name = "Qizhen Lan"},
  {name = "Yanteng Zhang"},
  {name = "Vince D. Calhoun"},
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "nibabel",
  "neuroHarmonize",
  "neuroCombat",
  "pyyaml",
  "pydantic>=2,<3",
  "pyarrow",
  "python-dotenv",
]

[project.urls]
Repository = "https://github.com/yuxiangwei0808/CONFIRM"
Documentation = "https://github.com/yuxiangwei0808/CONFIRM/blob/main/README.md"
Dataset = "https://huggingface.co/datasets/stanjsx/NeuroClaimBench"

[project.optional-dependencies]
dev = ["pytest", "build"]
llm = ["openai", "anthropic", "google-genai"]
imaging = ["nilearn", "h5py", "openpyxl"]

[project.scripts]
confirm = "confirm.cli:main"
neuroclaimbench = "bench.release_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
